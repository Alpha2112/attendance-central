global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - 'alert_rules.yml'

scrape_configs:
  - job_name: 'attendance-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:4000']
        labels:
          service: 'api-gateway'
          environment: 'production'

  - job_name: 'attendance-collector'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:4001']
        labels:
          service: 'collector-scheduler'
          environment: 'production'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
