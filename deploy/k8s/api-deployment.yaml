apiVersion: apps/v1
kind: Deployment
metadata:
  name: attendance-api
  namespace: attendance-platform
  labels:
    app.kubernetes.io/name: attendance-api
    app.kubernetes.io/part-of: attendance-platform
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: attendance-api
  template:
    metadata:
      labels:
        app: attendance-api
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: ghcr.io/techive/attendance-api:1.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: attendance-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: attendance-secrets
                  key: DB_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: attendance-secrets
                  key: REDIS_PASSWORD
          ports:
            - name: http
              containerPort: 4000
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          livenessProbe:
            httpGet:
              path: /api/v1/health/liveness
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health/readiness
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: attendance-api
  namespace: attendance-platform
spec:
  type: ClusterIP
  selector:
    app: attendance-api
  ports:
    - name: http
      port: 4000
      targetPort: 4000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: attendance-api-hpa
  namespace: attendance-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: attendance-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: attendance-api-pdb
  namespace: attendance-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: attendance-api
