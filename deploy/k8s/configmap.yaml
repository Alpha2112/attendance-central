apiVersion: v1
kind: ConfigMap
metadata:
  name: attendance-config
  namespace: attendance-platform
data:
  NODE_ENV: 'production'
  PORT: '4000'
  COLLECTOR_PORT: '4001'
  DB_HOST: 'mysql.attendance-platform.svc.cluster.local'
  DB_PORT: '3306'
  DB_DATABASE: 'attendance_db'
  DB_USERNAME: 'attendance_user'
  DB_CONNECTION_LIMIT: '25'
  DB_CONNECT_TIMEOUT_MS: '5000'
  REDIS_HOST: 'redis.attendance-platform.svc.cluster.local'
  REDIS_PORT: '6379'
  KAFKA_BROKERS: 'kafka-0.kafka.attendance-platform.svc.cluster.local:9092,kafka-1.kafka.attendance-platform.svc.cluster.local:9092'
  KAFKA_CLIENT_ID: 'attendance-platform-k8s'
  KAFKA_CONSUMER_GROUP: 'attendance-normalizer-group'
  LOG_LEVEL: 'info'
